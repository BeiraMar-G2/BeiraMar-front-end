name: CI/CD para EC2 pública e privada

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: FE - Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: FE - Instalar Dependências e Fazer Build
        run: |
          echo "VITE_API_URL=${{ secrets.REMOTE_HOST_PRIVADO }}" > .env
          npm install
          npm run build

      - name: FE - Copiar arquivos e Deploy (Usando SSH com rsync)
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SOURCE: "./dist/"
          TARGET: "/home/${{ secrets.REMOTE_USER }}/frontend/"
          ARGS: "-rltgoDzvO --delete"

      - name: FE - Executar Comando Shell na EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "🐳 Testando Docker..."
            sudo docker ps || true

            echo "📄 Atualizando arquivo default.conf..."
            mkdir -p /home/${{ secrets.REMOTE_USER }}/nginx-config

            cat << 'EOF' > /home/${{ secrets.REMOTE_USER }}/nginx-config/default.conf
            server {
                listen 80;
                server_name _;

                location / {
                    root /usr/share/nginx/html;
                    try_files $uri $uri/ /index.html;
                }

                location /api/ {
                    proxy_pass http://${{ secrets.REMOTE_HOST_PRIVADO }}:8080/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            EOF

            echo "🧹 Limpando containers antigos..."
            docker stop frontend_nginx 2>/dev/null || true
            docker rm frontend_nginx 2>/dev/null || true

            echo "🚀 Subindo container com docker compose..."
            cd /home/${{ secrets.REMOTE_USER }}/
            docker compose -f compose.yaml up -d --force-recreate

            echo "🔍 Containers ativos:"
            docker ps
