name: CI/CD para EC2 pública e privada

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout do repositório
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # 2️⃣ Configurar Node.js
      - name: FE - Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3️⃣ Instalar dependências e gerar build
      - name: FE - Instalar Dependências e Fazer Build
        run: |
          echo "VITE_API_URL=${{ secrets.REMOTE_HOST_PRIVADO }}" > .env
          npm install
          npm run build

      # 4️⃣ Enviar arquivos do build para EC2
      - name: FE - Copiar arquivos e Deploy (Usando SSH com rsync)
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SOURCE: "./dist/"
          TARGET: "/home/${{ secrets.REMOTE_USER }}/frontend/"
          ARGS: "-rltgoDzvO --delete --exclude=nginx --exclude=nginx-config"

      # 5️⃣ Executar comandos remotos na EC2
      - name: FE - Configurar NGINX e Subir Container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "🐳 Testando Docker..."
            sudo docker ps || true

            echo "📄 Criando docker-compose.yml se não existir..."
            if [ ! -f /home/${{ secrets.REMOTE_USER }}/docker-compose.yml ]; then
              echo "⚠️  Arquivo docker-compose.yml não encontrado, criando..."
              cat > /home/${{ secrets.REMOTE_USER }}/docker-compose.yml << 'EOFCOMPOSE'
            version: "3.9"
            services:
              web_server:
                image: nginx:latest
                container_name: frontend_nginx
                ports:
                  - "80:80"
                volumes:
                  - /home/${{ secrets.REMOTE_USER }}/frontend:/usr/share/nginx/html
                  - /home/${{ secrets.REMOTE_USER }}/nginx-config/default.conf:/etc/nginx/conf.d/default.conf
                restart: unless-stopped
            EOFCOMPOSE
            else
              echo "✅ Arquivo docker-compose.yml já existe"
            fi

            echo "📄 Atualizando arquivo default.conf..."
            mkdir -p /home/${{ secrets.REMOTE_USER }}/nginx-config

            cat << 'EOF' > /home/${{ secrets.REMOTE_USER }}/nginx-config/default.conf
            server {
                listen 80;
                server_name _;

                location / {
                    root /usr/share/nginx/html;
                    try_files $uri $uri/ /index.html;
                }

                location /api/ {
                    proxy_pass http://${{ secrets.REMOTE_HOST_PRIVADO }}:8080/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            EOF

            echo "📄 Verificando arquivos criados..."
            ls -la /home/${{ secrets.REMOTE_USER }}/docker-compose.yml
            cat /home/${{ secrets.REMOTE_USER }}/docker-compose.yml

            echo "🧹 Limpando containers antigos..."
            docker stop frontend_nginx 2>/dev/null || true
            docker rm frontend_nginx 2>/dev/null || true

            echo "🚀 Subindo container com docker compose..."
            docker compose -f /home/${{ secrets.REMOTE_USER }}/docker-compose.yml up -d --force-recreate

            echo "🔍 Containers ativos:"
            docker ps

            echo "✅ Deploy concluído com sucesso!"

      # 6. Atualizando o IP privado da API e reininciado o docker do Ngnix
      - name: FE - Executar Comando Shell na EC2
        uses: appleboy/ssh-action@v1.0.3 # Action popular para SSH
        with:
          host: ${{ secrets.REMOTE_HOST }} 
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}  

          # O Comando ou Script a ser Executado no EC2
          # Use o pipe '|' para comandos de múltiplas linhas
          script: |
            set -e

            # Cria diretórios com permissão correta
            sudo mkdir -p /home/${{ secrets.REMOTE_USER }}/frontend/nginx/templates
            sudo mkdir -p /home/${{ secrets.REMOTE_USER }}/frontend/nginx-config
            sudo chown -R ec2-user:ec2-user /home/${{ secrets.REMOTE_USER }}/frontend

            export IP_PORTA_API=${{ secrets.REMOTE_HOST_PRIVADO }}:8080
            echo "Variável de IP e porta da API criada: $IP_PORTA_API"
            
            envsubst '${IP_PORTA_API}' /home/${{ secrets.REMOTE_USER }}/frontend/nginx-config/default.conf
            
            echo "Arquivo default.conf do ngnix criado"

            docker compose -f /home/${{ secrets.REMOTE_USER }}/compose.yaml down
            echo "Docker compose do Ngnix parado"
            
            docker compose -f /home/${{ secrets.REMOTE_USER }}/compose.yaml up -d --build
            echo "Docker compose do Ngnix reiniciado"
