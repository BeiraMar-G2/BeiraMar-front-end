name: CI/CD para EC2 pública e privada

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # 2. Configuração do ambiente Node
      - name: FE - Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Build da aplicação (corrigido)
      - name: FE - Instalar Dependências e Fazer Build
        working-directory: ./beiramar-front-end   # ✅ entra na pasta do projeto React
        run: |
          echo "VITE_API_URL=${{ secrets.REMOTE_HOST_PRIVADO }}" > .env
          echo "📋 Conteúdo do arquivo .env:"
          cat .env
          npm install
          npm install axios
          echo "Iniciando build..."
          npm run build

      # 4. Deploy (Transferência de arquivos e execução de comandos remotos)
      - name: FE - Copiar arquivos e Deploy (Usando SSH com rsync)
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          TARGE
