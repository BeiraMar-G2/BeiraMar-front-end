name: CI/CD para EC2 pública e privada

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout do repositório
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # 2️⃣ Configurar Node.js
      - name: FE - Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3️⃣ Instalar dependências e gerar build
      - name: FE - Instalar Dependências e Fazer Build
        run: |
          echo "🧩 Criando arquivo .env..."
          echo "VITE_API_URL=${{ secrets.REMOTE_HOST_PRIVADO }}" > .env
          echo "📋 Conteúdo do .env:"
          cat .env

          echo "📦 Instalando dependências..."
          npm install
          npm install axios

          echo "🏗️ Iniciando build..."
          npm run build

          echo "📁 Estrutura de diretórios após o build:"
          ls -la
          echo "📁 Conteúdo da pasta build:"
          ls -la build || echo "⚠️ Diretório build não encontrado!"

      # 4️⃣ Copiar build para EC2 com rsync
      - name: FE - Copiar arquivos e Deploy (Usando SSH com rsync)
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SOURCE: "./"
          TARGET: "/home/${{ secrets.REMOTE_USER }}/frontend"
          ARGS: "-rltgoDzvO --delete"

      # 5️⃣ Configurar e reiniciar Nginx no container
      - name: FE - Executar Comando Shell na EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "⚙️ Criando diretório de configuração do Nginx..."
            mkdir -p /home/${{ secrets.REMOTE_USER }}/nginx-config

            echo "📄 Criando arquivo default.conf..."
            cat > /home/${{ secrets.REMOTE_USER }}/nginx-config/default.conf << 'EOF'
            server {
                listen 80;
                server_name _;

                location / {
                    root /usr/share/nginx/html;
                    try_files $uri $uri/ /index.html;
                }

                location /api/ {
                    proxy_pass http://${{ secrets.REMOTE_HOST_PRIVADO }}:8080/;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            EOF

            echo "✅ Arquivo default.conf criado/atualizado"
            cat /home/${{ secrets.REMOTE_USER }}/nginx-config/default.conf

            echo "🧾 Ajustando permissões do diretório frontend..."
            sudo chmod -R 755 /home/${{ secrets.REMOTE_USER }}/frontend
            sudo find /home/${{ secrets.REMOTE_USER }}/frontend -type f -exec chmod 644 {} \;

            echo "🧹 Limpando containers antigos..."
            docker stop frontend_nginx 2>/dev/null || true
            docker rm frontend_nginx 2>/dev/null || true

            echo "🚀 Subindo novo container com docker compose..."
            cd /home/${{ secrets.REMOTE_USER }}
            docker compose -f compose.yaml up -d

            echo "⏳ Aguardando Nginx iniciar..."
            sleep 3

            echo "🔍 Containers ativos:"
            docker ps | grep frontend_nginx || echo "⚠️ Container frontend_nginx não encontrado!"

            echo "✅ Nginx configurado e reiniciado com sucesso!"
